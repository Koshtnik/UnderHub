<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Underhub</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>


<form class="poisk" action="/search" method="GET">
    <input type="text" name="query" class="poisk-input" placeholder="Истинный поиск " required>
    <button class="poisk-button" type="submit">Найти</button>
</form>

<a href="/" class="home-ref">
    <img class="home-button" src="/static/imgs/logo.png" >
</a>

<div class="fon-2">

    {% for i in text %}
        <div class="ramka">
            <div class="zagolovok">{{ i.zagolowok }}</div>
            <p class="text">{{ i.text }}</p>
        </div>
    {% endfor %}
</div>

</body>
</html>
